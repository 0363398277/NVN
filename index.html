
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cài đặt ứng dụng</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 28px 22px;
    background: #1b293d;
    border-radius: 20px;
    text-align: center;
}

.logo {
    font-size: 55px;
}

h2 {
    margin-bottom: 10px;
}

p {
    color: #cbd5e1;
    line-height: 1.5;
}

.btn {
    display: block;
    width: 100%;
    padding: 17px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
}

.download {
    background: #16a34a;
}

.open {
    background: #2563eb;
}

#openArea {
    display: none;
}

.note {
    margin-top: 20px;
    padding: 13px;
    background: #26364c;
    border-radius: 10px;
    font-size: 13px;
    text-align: left;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">📦</div>

    <h2>CÀI ĐẶT ỨNG DỤNG</h2>

    <p>
        Nhấn nút bên dưới để tải ứng dụng về điện thoại.
    </p>

    <!-- NÚT TẢI APK -->
    <a
        id="downloadBtn"
        class="btn download"
        href="https://0363398277.github.io/NVN/Key.apk"
        download="Key.apk">
        ⬇ TẢI APK
    </a>

    <!-- CHỈ HIỆN SAU KHI NHẤN TẢI -->
    <div id="openArea">

        <p>
            Sau khi tải xong, hãy mở danh sách tải xuống:
        </p>

        <button
            class="btn open"
            onclick="openDownloads()">
            📥 MỞ DANH SÁCH TẢI XUỐNG
        </button>

        <div class="note">
            <b>Nếu nút không mở được:</b>
            <ol>
                <li>Nhấn dấu ba chấm trong trình duyệt.</li>
                <li>Chọn mục Tệp đã tải xuống (Downloads).</li>
                <li>Chọn Key.apk.</li>
                <li>Nhấn Cài đặt.</li>
            </ol>
        </div>

    </div>

</div>

<script>
const downloadBtn = document.getElementById("downloadBtn");
const openArea = document.getElementById("openArea");

downloadBtn.addEventListener("click", function() {
    openArea.style.display = "block";
});

function openDownloads() {
    const ua = navigator.userAgent.toLowerCase();

    // Thử mở trang tải xuống của Chrome trên Android
    if (ua.includes("chrome") && ua.includes("android")) {
        window.location.href = "chrome://downloads/";
        return;
    }

    // Thử giao diện Downloads của trình duyệt khác
    alert(
        "Hãy mở menu trình duyệt (dấu ⋮), " +
        "chọn Tệp đã tải xuống hoặc Downloads, " +
        "sau đó mở Key.apk."
    );
}
</script>

</body>
</html>
